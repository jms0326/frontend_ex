<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat body -->
  <ellipse cx="100" cy="130" rx="80" ry="60" fill="#4CAF50" stroke="#388E3C" stroke-width="2"/>
  
  <!-- Cat head -->
  <circle cx="100" cy="80" r="50" fill="#4CAF50" stroke="#388E3C" stroke-width="2"/>
  
  <!-- Ears -->
  <polygon points="70,50 50,20 90,40" fill="#4CAF50" stroke="#388E3C" stroke-width="2"/>
  <polygon points="130,50 150,20 110,40" fill="#4CAF50" stroke="#388E3C" stroke-width="2"/>
  
  <!-- Inner ears -->
  <polygon points="75,45 65,25 85,35" fill="#8BC34A" stroke="#388E3C" stroke-width="1"/>
  <polygon points="125,45 135,25 115,35" fill="#8BC34A" stroke="#388E3C" stroke-width="1"/>
  
  <!-- Eyes -->
  <circle cx="80" cy="75" r="8" fill="white" stroke="#388E3C" stroke-width="1"/>
  <circle cx="120" cy="75" r="8" fill="white" stroke="#388E3C" stroke-width="1"/>
  <circle cx="80" cy="75" r="4" fill="#000" />
  <circle cx="120" cy="75" r="4" fill="#000" />
  
  <!-- Nose -->
  <triangle points="100,85 95,90 105,90" fill="#FF5722" stroke="#388E3C" stroke-width="1"/>
  
  <!-- Mouth -->
  <path d="M 100,90 Q 105,100 100,105 Q 95,100 100,90" fill="none" stroke="#388E3C" stroke-width="1"/>
  
  <!-- Whiskers -->
  <line x1="60" y1="90" x2="40" y2="85" stroke="#388E3C" stroke-width="1"/>
  <line x1="60" y1="95" x2="40" y2="95" stroke="#388E3C" stroke-width="1"/>
  <line x1="60" y1="100" x2="40" y2="105" stroke="#388E3C" stroke-width="1"/>
  <line x1="140" y1="90" x2="160" y2="85" stroke="#388E3C" stroke-width="1"/>
  <line x1="140" y1="95" x2="160" y2="95" stroke="#388E3C" stroke-width="1"/>
  <line x1="140" y1="100" x2="160" y2="105" stroke="#388E3C" stroke-width="1"/>
  
  <!-- Legs -->
  <ellipse cx="70" cy="160" rx="15" ry="25" fill="#4CAF50" stroke="#388E3C" stroke-width="2"/>
  <ellipse cx="130" cy="160" rx="15" ry="25" fill="#4CAF50" stroke="#388E3C" stroke-width="2"/>
  
  <!-- Paws -->
  <ellipse cx="70" cy="180" rx="20" ry="8" fill="#8BC34A" stroke="#388E3C" stroke-width="1"/>
  <ellipse cx="130" cy="180" rx="20" ry="8" fill="#8BC34A" stroke="#388E3C" stroke-width="1"/>
  
  <!-- Tail -->
  <path d="M 180,140 Q 190,100 170,80 Q 160,60 150,90" fill="none" stroke="#388E3C" stroke-width="8" stroke-linecap="round"/>
</svg>