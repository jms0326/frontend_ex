<body class="bg-background text-on-background min-h-screen flex flex-col">
  <!-- TopAppBar -->
  <header class="fixed top-0 w-full z-50 shadow-sm bg-surface">
    <div class="flex items-center px-4 md:px-6 h-16 w-full max-w-[1200px] mx-auto justify-between">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-primary text-3xl">pets</span>
        <h1 class="font-headline text-headline-md text-primary tracking-tight">Kindred Canine</h1>
      </div>
      <nav class="hidden md:flex items-center gap-8">
        <a class="font-label font-semibold label-lg text-on-surface-variant hover:opacity-80 transition-opacity" href="../index.html">Home</a>
        <a class="font-label font-semibold label-lg text-on-surface-variant hover:opacity-80 transition-opacity" href="../checkup-products/index.html">Products</a>
        <a class="font-label font-semibold label-lg text-on-surface-variant hover:opacity-80 transition-opacity" href="../reservation/index.html">Reservation</a>
        <a class="font-label font-semibold label-lg text-primary" href="../login/index.html">Login</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center pt-24 px-4 md:px-6 pb-24 md:pb-0">
    <div class="w-full max-w-[480px] mx-auto bg-surface-container-lowest rounded-2xl shadow-lg p-8 md:p-10 border border-outline-variant/30">
      <div class="text-center mb-8">
        <span class="material-symbols-outlined text-primary text-5xl mb-4">add_circle</span>
        <h2 class="font-headline text-2xl md:text-3xl text-on-surface mb-2">Create Account</h2>
        <p class="font-body text-body-md text-on-surface-variant">Join the community of caring pet parents</p>
      </div>
      <form id="signupForm" class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="firstName" class="block font-label font-semibold label-lg text-on-surface mb-1">First Name</label>
            <input id="firstName" type="text" placeholder="John" class="w-full px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all font-body text-body-md bg-white" required />
          </div>
          <div>
            <label for="lastName" class="block font-label font-semibold label-lg text-on-surface mb-1">Last Name</label>
            <input id="lastName" type="text" placeholder="Doe" class="w-full px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all font-body text-body-md bg-white" required />
          </div>
        </div>
        <div>
          <label for="email" class="block font-label font-semibold label-lg text-on-surface mb-1">Email</label>
          <input id="email" type="email" placeholder="you@example.com" class="w-full px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all font-body text-body-md bg-white" required />
        </div>
        <div>
          <label for="password" class="block font-label font-semibold label-lg text-on-surface mb-1">Password</label>
          <input id="password" type="password" placeholder="Min. 8 characters" class="w-full px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all font-body text-body-md bg-white" required />
        </div>
        <div>
          <label for="confirmPassword" class="block font-label font-semibold label-lg text-on-surface mb-1">Confirm Password</label>
          <input id="confirmPassword" type="password" placeholder="Repeat password" class="w-full px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all font-body text-body-md bg-white" required />
        </div>
        <div class="flex items-start gap-2">
          <input type="checkbox" id="terms" class="accent-primary w-5 h-5 mt-0.5 rounded border-outline-variant" required />
          <label for="terms" class="font-body text-sm text-on-surface-variant leading-relaxed">I agree to the <a href="#" class="text-primary font-semibold hover:underline">Terms of Service</a> and <a href="#" class="text-primary font-semibold hover:underline">Privacy Policy</a></label>
        </div>
        <button type="submit" class="w-full py-3 bg-primary text-on-primary rounded-xl font-label font-semibold label-lg shadow-lg hover:brightness-110 active:scale-95 transition-all">Create Account</button>
      </form>
      <div class="mt-6 text-center">
        <p class="font-body text-body-md text-on-surface-variant">Already have an account? <a href="../login/index.html" class="text-primary font-semibold hover:underline">Sign in</a></p>
      </div>
    </div>
  </main>

  <!-- BottomNavBar (Mobile Only) -->
  <nav class="md:hidden fixed bottom-0 left-0 w-full bg-surface shadow-[0px_-4px_16px_rgba(74,144,226,0.08)] rounded-t-xl z-50 flex justify-around items-center px-4 py-2 pb-safe">

  <script>
    // Created by DINKIssTyle on 2026. Copyright (C) 2026 DINKI'ssTyle. All rights reserved.
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      const confirmPw = document.getElementById('confirmPassword').value;
      if (pw !== confirmPw) {
        alert('Passwords do not match.');
        return;
      }
      alert('Account created successfully! Welcome to Kindred Canine.');
    });
  </script>
